<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NY</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b2e4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NY">
<link rel="apple-touch-icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/animations.css">
<style>
:root {
  --rg: #e8b4a0;
  --rgl: #f4c9b8;
  --rgd: #c99380;
  --wine: #8b2e4a;
  --gold: #d4a574;
  --bk: #0a0a0f;
  --mut: #a0a0b0;
  --card-bg: rgba(20, 20, 28, 0.6);
  --header-h: 60px;
  --navbar-h: 70px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Cairo, Tahoma, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #1a1a2a, var(--bk) 60%);
  color: #fff;
  overflow-x: hidden;
  transition: background 0.5s ease;
}

body.light-mode {
  background: linear-gradient(135deg, #fdf6f2, #f9e8e0);
  color: #2a1a1f;
}

body.no-animations * {
  animation: none !important;
  transition: none !important;
}

/* ============ الهيكل الأساسي ============ */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}

/* ============ الشريط العلوي ============ */
.app-header {
  position: sticky;
  top: 0;
  height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top);
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(212, 165, 116, 0.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 16px;
  padding-right: 16px;
  z-index: 100;
}

body.light-mode .app-header {
  background: rgba(255, 255, 255, 0.9);
  border-bottom-color: rgba(139, 46, 74, 0.15);
}

.header-title {
  font-family: 'Reem Kufi', serif;
  font-size: 1.5em;
  font-weight: 700;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--rgl), var(--gold), var(--rgd));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-subtitle {
  font-size: 0.7em;
  color: var(--mut);
  letter-spacing: 1px;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.header-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(232, 180, 160, 0.1);
  border: 1px solid rgba(212, 165, 116, 0.25);
  color: var(--rgl);
  font-size: 1.1em;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}

.header-btn:active {
  transform: scale(0.9);
  background: rgba(232, 180, 160, 0.25);
}

/* ============ المحتوى الرئيسي ============ */
.app-content {
  flex: 1;
  padding: 12px;
  padding-bottom: calc(var(--navbar-h) + var(--safe-bottom) + 12px);
  overflow-y: auto;
}

/* ============ الشريط السفلي ============ */
.app-navbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  height: calc(var(--navbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(10, 10, 15, 0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(212, 165, 116, 0.15);
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  z-index: 200;
}

body.light-mode .app-navbar {
  background: rgba(255, 255, 255, 0.95);
  border-top-color: rgba(139, 46, 74, 0.15);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: var(--mut);
  transition: all 0.3s;
  position: relative;
  padding: 8px 4px;
  border: 0;
  background: transparent;
  font-family: inherit;
}

.nav-item .nav-icon {
  font-size: 1.4em;
  line-height: 1;
  transition: transform 0.3s;
}

.nav-item .nav-label {
  font-size: 0.6em;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.nav-item.active {
  color: var(--rg);
}

.nav-item.active .nav-icon {
  transform: scale(1.15) translateY(-2px);
}

.nav-item.active::after {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 3px;
  background: linear-gradient(90deg, var(--rgd), var(--rg));
  border-radius: 0 0 3px 3px;
}

.nav-item:active .nav-icon {
  transform: scale(0.9);
}

/* زر الإضافة المميز */
.nav-item.add-btn .nav-icon {
  background: linear-gradient(135deg, var(--wine), var(--rgd));
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3em;
  box-shadow: 0 4px 15px rgba(139, 46, 74, 0.5);
  transform: translateY(-8px);
  border: 2px solid rgba(212, 165, 116, 0.3);
}

.nav-item.add-btn.active .nav-icon {
  transform: translateY(-8px) scale(1.1);
}

/* ============ الشاشة الكاملة (بدون شريط سفلي) ============ */
.full-screen {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at top, #1a1a2a, var(--bk) 60%);
  z-index: 300;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  animation: slideInFromBottom 0.3s ease-out;
}

@keyframes slideInFromBottom {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

body.light-mode .full-screen {
  background: linear-gradient(135deg, #fdf6f2, #f9e8e0);
}

/* ============ عناصر عامة ============ */
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; }

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 12px;
  border: 1px solid var(--rgd);
  background: rgba(232, 180, 160, 0.08);
  outline: 0;
  color: inherit;
}

input:focus, textarea:focus {
  border-color: var(--rg);
  box-shadow: 0 0 0 3px rgba(232, 180, 160, 0.15);
}

.top, .hd, .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.hd {
  padding: 12px 16px;
  background: rgba(10, 10, 15, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(212, 165, 116, 0.15);
  font-size: 0.9em;
  position: sticky;
  top: 0;
  z-index: 50;
}

.hd a, .hd button {
  color: var(--rgl);
  text-decoration: none;
  font-size: 1.2em;
  padding: 6px 10px;
  border-radius: 10px;
  background: rgba(232, 180, 160, 0.1);
  border: 0;
  cursor: pointer;
}

.hd b {
  color: var(--rg);
  font-family: 'Reem Kufi', serif;
  letter-spacing: 2px;
}

.app-logo-small {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  box-shadow: 0 0 15px rgba(232, 180, 160, 0.4);
  object-fit: cover;
}

.app-logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  box-shadow: 0 0 30px rgba(232, 180, 160, 0.4);
  object-fit: cover;
  display: block;
  margin: 0 auto 12px;
}

.card, .card2 {
  background: linear-gradient(135deg, var(--wine), var(--rgd));
  border-radius: 20px;
  padding: 24px 16px;
  margin-bottom: 12px;
  text-align: center;
  white-space: pre-line;
  line-height: 1.9;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 10px 30px rgba(139, 46, 74, 0.5);
}

.card2 {
  background: rgba(232, 180, 160, 0.08);
  border: 1px solid rgba(212, 165, 116, 0.25);
  text-align: right;
  align-items: stretch;
  justify-content: flex-start;
  padding: 14px;
  min-height: 0;
  white-space: normal;
  line-height: 1.6;
  box-shadow: none;
}

.card2 p {
  white-space: pre-wrap;
  color: #e0e0e0;
  font-size: 0.9em;
}

.card2 img { width: 48%; margin: 6px 1%; border-radius: 10px; }
.card2 small { color: var(--mut); }
.card2 small a { color: #d9534f; }

.btn, .btn2 {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-weight: 700;
  margin: 4px 0;
  background: linear-gradient(135deg, var(--wine), var(--rgd));
  color: white;
  transition: transform 0.2s;
  border: 1px solid rgba(212, 165, 116, 0.3);
}

.btn2 { background: rgba(232, 180, 160, 0.1); color: var(--rgl); }
.btn:active, .btn2:active { transform: scale(0.96); }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
  font-size: 0.75em;
  color: var(--mut);
  text-align: center;
}

.stats b { display: block; color: var(--rg); font-size: 1.6em; }

.toast {
  position: fixed;
  top: 16px;
  right: 16px;
  left: 16px;
  max-width: 360px;
  margin: auto;
  padding: 12px;
  border-radius: 12px;
  background: var(--wine);
  z-index: 999;
  text-align: center;
  animation: slideInRight 0.3s;
  box-shadow: 0 10px 30px rgba(139, 46, 74, 0.5);
}

.ov {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 998;
  animation: fadeIn 0.3s;
}

.ov .card { width: 100%; max-width: 420px; }

.empty {
  text-align: center;
  color: var(--mut);
  padding: 40px 20px;
}

.empty-icon { font-size: 3em; opacity: 0.5; margin-bottom: 12px; }

/* ============ شاشة الدخول ============ */
.login {
  text-align: center;
  padding: 10vh 20px 40px;
}

.login h1 {
  font-family: 'Reem Kufi', serif;
  font-size: 4em;
  letter-spacing: 8px;
  background: linear-gradient(135deg, var(--rgl), var(--gold), var(--rgd));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 8px;
}

.login-tagline {
  color: var(--mut);
  font-size: 0.9em;
  letter-spacing: 3px;
  margin-bottom: 30px;
}

/* ============ التنقل الداخلي ============ */
.tabs-scroll {
  display: flex;
  gap: 6px;
  padding: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -12px;
  padding-left: 12px;
  padding-right: 12px;
}

.tabs-scroll::-webkit-scrollbar { display: none; }

.tabs-scroll button {
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(232, 180, 160, 0.08);
  border: 1px solid rgba(212, 165, 116, 0.25);
  font-size: 0.85em;
  white-space: nowrap;
  font-weight: 600;
  color: var(--mut);
  transition: all 0.3s;
}

.tabs-scroll button.active {
  background: linear-gradient(135deg, var(--wine), var(--rgd));
  color: white;
  border-color: var(--rg);
}

/* ============ الشبكة الرئيسية ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.grid a, .grid button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 16px 6px;
  font-size: 1.6em;
  text-decoration: none;
  color: #fff;
  border-radius: 16px;
  border: 1px solid rgba(212, 165, 116, 0.25);
  background: linear-gradient(135deg, var(--wine), #4a2030);
  transition: transform 0.3s, box-shadow 0.3s;
  min-height: 80px;
  justify-content: center;
  font-family: inherit;
  cursor: pointer;
}

.grid a:hover, .grid a:active,
.grid button:hover, .grid button:active {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(232, 180, 160, 0.3);
}

.grid a span, .grid button span {
  font-size: 0.55em;
  font-weight: 700;
}

/* ============ بطاقة ترحيب ============ */
.welcome-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--card-bg);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(212, 165, 116, 0.25);
  border-radius: 16px;
  margin-bottom: 12px;
}

.welcome-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: rgba(232, 180, 160, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6em;
  overflow: hidden;
  flex-shrink: 0;
}

.welcome-avatar img { width: 100%; height: 100%; object-fit: cover; }
.welcome-info { flex: 1; }

.welcome-name {
  color: var(--rg);
  font-family: 'Reem Kufi', serif;
  font-size: 1em;
  font-weight: 700;
}

.welcome-status { color: var(--mut); font-size: 0.78em; margin-top: 2px; }

.logout-btn {
  background: rgba(217, 83, 79, 0.15);
  border: 1px solid rgba(217, 83, 79, 0.4);
  color: #ff8a80;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.1em;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  flex-shrink: 0;
}

.logout-btn:active {
  transform: scale(0.9);
  background: rgba(217, 83, 79, 0.3);
}

/* ============ إخفاء/إظهار ============ */
.hidden { display: none !important; }

/* ============ شريط الحالة ============ */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(232, 180, 160, 0.06);
  border: 1px solid rgba(212, 165, 116, 0.15);
  border-radius: 12px;
  font-size: 0.75em;
  color: var(--mut);
  margin-bottom: 12px;
}

.status-bar b { color: var(--rg); letter-spacing: 1px; }

/* ============ مشغل الأغاني ============ */
.music-player {
  position: fixed;
  bottom: calc(var(--navbar-h) + var(--safe-bottom) + 12px);
  right: 12px;
  background: rgba(20, 20, 28, 0.92);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(212, 165, 116, 0.3);
  border-radius: 30px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
  z-index: 90;
  max-width: 240px;
}

.music-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(232, 180, 160, 0.1);
  color: var(--rgl);
  font-size: 0.9em;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  border: 1px solid rgba(212, 165, 116, 0.2);
}

.music-play {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--wine), var(--rgd));
}

.music-name {
  font-size: 0.65em;
  color: var(--rg);
  font-weight: 600;
  padding: 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 80px;
  cursor: pointer;
}

/* ============ الدردشة ============ */
.chat-msg {
  animation: slideInFromBottom 0.3s ease-out;
}

.chat-action-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(232, 180, 160, 0.1);
  border: 1px solid rgba(212, 165, 116, 0.25);
  color: var(--rgl);
  font-size: 1.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}

.chat-action-btn:active {
  transform: scale(0.9);
  background: rgba(232, 180, 160, 0.25);
}

.chat-send-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--wine), var(--rgd));
  color: white;
  font-size: 1.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid rgba(212, 165, 116, 0.3);
  box-shadow: 0 4px 12px rgba(139, 46, 74, 0.4);
}

.chat-send-btn:active {
  transform: scale(0.9);
}

/* ============ AI Assistant ============ */
.ai-msg {
  animation: fadeIn 0.3s ease-out;
  word-wrap: break-word;
}

@keyframes slideInFromBottom {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Sub-tabs داخل التاب */
.sub-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 6px;
}

.sub-tabs::-webkit-scrollbar { display: none; }

.sub-tabs button {
  padding: 8px 14px;
  border-radius: 12px;
  background: rgba(232, 180, 160, 0.08);
  border: 1px solid rgba(212, 165, 116, 0.25);
  font-size: 0.8em;
  white-space: nowrap;
  font-weight: 600;
  color: var(--mut);
  transition: all 0.3s;
  cursor: pointer;
}

.sub-tabs button.active {
  background: linear-gradient(135deg, var(--wine), var(--rgd));
  color: white;
  border-color: var(--rg);
}
</style>
</head>
